name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned rather than macos-latest. The Swift version follows the runner
    # image, so an unpinned image would change the toolchain under this
    # repository without a commit — and INV-1 is a claim about which language
    # mode the package is built in.
    runs-on: macos-15 # INV-13: needs a Swift build

    steps:
      # INV-13 tripwire — rationale at the copy in gates.yml's gates job. This
      # run would bill identically to that one when private, so it is guarded
      # identically.
      - name: Visibility tripwire (INV-13)
        run: |
          vis="${{ github.event.repository.private }}"
          if [ "$vis" != "false" ]; then
            echo "INV-13: visibility is not provably public (private='${vis:-unreadable}') — revisit the amendment" >&2
            exit 1
          fi
          echo "INV-13: repository is public; the amendment's condition holds"

      - uses: actions/checkout@v4

      # Recorded rather than assumed: every claim this repository makes about
      # the build is a claim against a specific toolchain.
      - name: Record the toolchain
        run: |
          swift --version
          swift format --version

      # CI runs bootstrap for the same reason a developer does, so that any
      # commit a workflow makes passes through the commit-msg hook.
      - name: Install the hook path
        run: scripts/dev/bootstrap.sh

      # -warnings-as-errors is the whole of INV-5. --build-tests is on the
      # debug pass only: a release build of test targets is not a
      # configuration anything ships.
      - name: Build, debug
        run: swift build -Xswiftc -warnings-as-errors

      - name: Build, debug, with tests
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Build, release
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --parallel

      # The app target rides the same runner as the package build — the
      # INV-13 marker on this job's runs-on line covers it, and no second
      # runner spins. Warnings-as-errors binds in the committed project
      # settings (SWIFT_TREAT_WARNINGS_AS_ERRORS, read by gate-arch), not in
      # a flag here. A simulator build needs no signing; CODE_SIGNING_ALLOWED
      # makes that explicit rather than assumed.
      - name: Build the app target for the iOS simulator
        run: |
          xcodebuild -version
          xcodebuild -project Midkeep.xcodeproj -scheme Midkeep \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
