name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    # Pinned for the same reason as ci.yml: three of the seven gates shell out
    # to the toolchain, and an unpinned image moves it without a commit.
    runs-on: macos-15 # INV-13: needs a Swift build

    steps:
      # INV-13's revisit trigger, machine-checked where the money would be
      # spent. The amendment replacing the push-trigger ban holds only while
      # this repository is public, and visibility is not readable from the
      # tree — but it is readable here, at run time. Affirmative proof, not a
      # private check: github.event.repository can be absent on event types
      # this file might gain later, and an empty interpolation must fail
      # loudly rather than pass silently — a check with a path on which it
      # cannot fail is the meta.captured defect. Anything but a measured
      # "false" fails the run before it checks anything out. Cost if it ever
      # fires: one run against the private tier's free allowance. The
      # interpolated value is a boolean from GitHub, not attacker text. The
      # same step guards every job that spins a runner, here and in ci.yml.
      - name: Visibility tripwire (INV-13)
        run: |
          vis="${{ github.event.repository.private }}"
          if [ "$vis" != "false" ]; then
            echo "INV-13: visibility is not provably public (private='${vis:-unreadable}') — revisit the amendment" >&2
            exit 1
          fi
          echo "INV-13: repository is public; the amendment's condition holds"

      - uses: actions/checkout@v4
        with:
          # gate-hygiene resolves origin/main..HEAD for INV-8. A shallow clone
          # would hand it a single commit on a pull request, so the gate would
          # inspect one message and report on the branch.
          fetch-depth: 0

      - name: Install the hook path
        run: scripts/dev/bootstrap.sh

      # Without actionlint, gate-workflow returns 2, all.sh returns 2, and a
      # no-verdict fails this job before Teeth can run — measured on the first
      # push. Installed pinned by version and checksum from the upstream
      # release rather than from a marketplace action or an unpinned installer
      # script: a third-party action is a dependency in all but name, and this
      # uses only tools the job already trusts. v1.7.12 is the version
      # gate-workflow was verified against locally. The gate's contract does
      # not change: a clone without actionlint still gets 2 with the reason on
      # stderr, and this step touches only this runner's PATH. The pinned
      # artifact and the pinned image move together or not at all — the
      # darwin_arm64 build matches macos-15, and the --version line below is
      # the tripwire a future runner change trips (Exec format error).
      - name: Install actionlint (pinned)
        run: |
          version=1.7.12
          sha256=aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_darwin_arm64.tar.gz"
          echo "$sha256  $RUNNER_TEMP/actionlint.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/actionlint" --version

      # 0 clean, 1 findings on stdout, 2 no verdict with a reason on stderr.
      # A no-verdict outranks a finding, and a missing gate is also 2.
      - name: Gates
        run: scripts/gates/all.sh

      # The harness that proves each gate fails on a planted defect. It builds
      # one worktree per case, so it is the slowest step here by a wide margin.
      #
      # It measured 42.2 seconds locally: host caches warm, on Apple Silicon,
      # with each case compiling from scratch in a fresh worktree — the build
      # cache is cold per case by design. That number is not a claim about
      # this runner and has never been observed here. This runner performs the
      # same from-scratch compiles on a different machine with its own setup
      # overhead, and whether this step is viable on every push is an open
      # measurement rather than a settled question. Whoever first watches it
      # time out should know it was never claimed to fit.
      - name: Teeth
        run: scripts/gates/teeth.sh

  pull-request-body:
    # INV-8 covers the pull request body as well as commit messages, and the
    # commit-msg hook cannot see a body. No toolchain is needed, so this runs
    # on the cheaper image.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # INV-13 tripwire — rationale at the gates job's copy above. The 1x
      # ubuntu tier is cheaper when private, not free, so this job is guarded
      # like the macos ones.
      - name: Visibility tripwire (INV-13)
        run: |
          vis="${{ github.event.repository.private }}"
          if [ "$vis" != "false" ]; then
            echo "INV-13: visibility is not provably public (private='${vis:-unreadable}') — revisit the amendment" >&2
            exit 1
          fi
          echo "INV-13: repository is public; the amendment's condition holds"

      - uses: actions/checkout@v4

      - name: INV-8 over the pull request body
        # Through the environment rather than interpolated into the script: a
        # body is attacker-controlled text and must never become shell source.
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          family="$(sed -n "s/^family='\(.*\)'\$/\1/p" .githooks/commit-msg)"
          if [ -z "$family" ]; then
            echo "cannot run: no family list in .githooks/commit-msg" >&2
            exit 2
          fi

          # Derived from the hook, never restated. ERE, not BRE: \| is a GNU
          # extension and the gates job runs on a BSD grep.
          pattern="^[[:space:]]*co-authored-by:.*(${family})"
          pattern="$pattern|^[[:space:]]*claude-session:"
          pattern="$pattern|generated with .*claude code"

          if printf '%s\n' "$BODY" | grep -qiE "$pattern"; then
            echo "INV-8: the pull request body carries an attribution trailer" >&2
            exit 1
          fi
          echo "INV-8: pull request body carries no attribution trailer"
